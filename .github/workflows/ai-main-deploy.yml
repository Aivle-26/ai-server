name: AI Main Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-main-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Test and Deploy to Existing EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and test
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m unittest discover -v
          python -m compileall -q app tests

      - name: Package AI server source
        id: package
        shell: bash
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/aipm-ai-${GITHUB_SHA}.tar.gz"
          tar \
            --exclude='./.git' \
            --exclude='./.github' \
            --exclude='./.venv' \
            --exclude='*/__pycache__' \
            --exclude='*.py[cod]' \
            --exclude='./.env' \
            --exclude='./.env.*' \
            --exclude='./data' \
            --exclude='./logs' \
            -czf "$archive" .

          echo "path=$archive" >> "$GITHUB_OUTPUT"

      - name: Prepare SSH files
        id: ssh
        shell: bash
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          if [[ -z "${EC2_SSH_KEY}" || -z "${EC2_KNOWN_HOSTS}" ]]; then
            echo "EC2_SSH_KEY and EC2_KNOWN_HOSTS secrets are required" >&2
            exit 1
          fi

          key_file="$RUNNER_TEMP/aipm-ec2-key"
          known_hosts_file="$RUNNER_TEMP/aipm-known-hosts"

          umask 077
          printf '%s\n' "${EC2_SSH_KEY}" > "$key_file"
          printf '%s\n' "${EC2_KNOWN_HOSTS}" > "$known_hosts_file"
          chmod 600 "$key_file"

          echo "key_file=$key_file" >> "$GITHUB_OUTPUT"
          echo "known_hosts_file=$known_hosts_file" >> "$GITHUB_OUTPUT"

      - name: Upload AI source archive to EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
          LOCAL_ARCHIVE: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail

          if [[ -z "${EC2_HOST}" || -z "${EC2_USER}" ]]; then
            echo "EC2_HOST and EC2_USER secrets are required" >&2
            exit 1
          fi

          remote_archive="/tmp/aipm-ai-${GITHUB_SHA}.tar.gz"
          echo "REMOTE_ARCHIVE=$remote_archive" >> "$GITHUB_ENV"

          scp \
            -i "$SSH_KEY_FILE" \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            "$LOCAL_ARCHIVE" \
            "${EC2_USER}@${EC2_HOST}:${remote_archive}"

      - name: Deploy AI server on EC2
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail

          ssh \
            -i "$SSH_KEY_FILE" \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "REMOTE_ARCHIVE='${REMOTE_ARCHIVE}' REVISION='${GITHUB_SHA}' bash -s" <<'REMOTE_DEPLOY'
          set -euo pipefail

          DEPLOY_DIR="/opt/aipm/ai-server"
          VENV_DIR="$DEPLOY_DIR/.venv"
          ENV_FILE="/etc/aipm-ai-test.env"
          AI_SERVICE="aipm-ai-test.service"
          HEALTH_URL="http://127.0.0.1:8090/health"
          NGINX_HEALTH_URL="http://127.0.0.1/ai-test/health"
          RELEASE_DIR="/tmp/aipm-ai-release-${REVISION}"
          BACKUP_DIR="/tmp/aipm-ai-backup-${REVISION}"
          HEALTH_RETRIES=30
          HEALTH_SLEEP_SECONDS=2
          RSYNC_ARGS=(
            --archive
            --delete
            '--exclude=.venv/'
            '--exclude=data/'
            '--exclude=logs/'
            '--exclude=.env'
            '--exclude=.env.*'
          )

          cleanup() {
            rm -f "$REMOTE_ARCHIVE"
            rm -rf "$RELEASE_DIR" "$BACKUP_DIR"
          }

          wait_for_health() {
            local attempt
            for attempt in $(seq 1 "$HEALTH_RETRIES"); do
              if curl --fail --silent --show-error "$HEALTH_URL" >/dev/null \
                && curl --fail --silent --show-error "$NGINX_HEALTH_URL" >/dev/null; then
                echo "AI health check succeeded"
                return 0
              fi

              echo "AI health check attempt ${attempt}/${HEALTH_RETRIES} failed"
              sleep "$HEALTH_SLEEP_SECONDS"
            done
            return 1
          }

          rollback() {
            local reason="$1"
            echo "AI deployment failed; rolling back: $reason" >&2
            set +e
            rsync "${RSYNC_ARGS[@]}" "$BACKUP_DIR/" "$DEPLOY_DIR/"
            sudo -n systemctl restart "$AI_SERVICE"
            wait_for_health
            exit 1
          }

          trap cleanup EXIT

          test -f "$REMOTE_ARCHIVE"
          test -d "$DEPLOY_DIR"
          test -x "$VENV_DIR/bin/python"
          sudo -n test -f "$ENV_FILE"
          sudo -n true
          sudo -n systemctl is-active --quiet "$AI_SERVICE"
          command -v rsync >/dev/null
          command -v tar >/dev/null
          command -v curl >/dev/null

          rm -rf "$RELEASE_DIR" "$BACKUP_DIR"
          mkdir -p "$RELEASE_DIR" "$BACKUP_DIR"
          tar -xzf "$REMOTE_ARCHIVE" -C "$RELEASE_DIR"

          test -f "$RELEASE_DIR/app/main.py"
          test -f "$RELEASE_DIR/requirements.txt"

          "$VENV_DIR/bin/python" -m pip install \
            --disable-pip-version-check \
            -r "$RELEASE_DIR/requirements.txt"

          (
            cd "$RELEASE_DIR"
            "$VENV_DIR/bin/python" -m unittest discover -v
            "$VENV_DIR/bin/python" -m compileall -q app tests
            "$VENV_DIR/bin/python" -m pip check
          )

          rsync "${RSYNC_ARGS[@]}" "$DEPLOY_DIR/" "$BACKUP_DIR/"

          if ! rsync "${RSYNC_ARGS[@]}" "$RELEASE_DIR/" "$DEPLOY_DIR/"; then
            rollback "code synchronization failed"
          fi

          if ! sudo -n systemctl restart "$AI_SERVICE"; then
            rollback "systemd restart failed"
          fi

          if ! wait_for_health; then
            rollback "health check failed"
          fi

          echo "AI deployment succeeded: ${REVISION}"
          REMOTE_DEPLOY

      - name: Cleanup remote deployment files
        if: always()
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          SSH_KEY_FILE: ${{ steps.ssh.outputs.key_file }}
          KNOWN_HOSTS_FILE: ${{ steps.ssh.outputs.known_hosts_file }}
        run: |
          set -euo pipefail

          if [[ -z "${EC2_HOST:-}" || -z "${EC2_USER:-}" || -z "${SSH_KEY_FILE:-}" || -z "${KNOWN_HOSTS_FILE:-}" ]]; then
            exit 0
          fi

          remote_archive="${REMOTE_ARCHIVE:-/tmp/aipm-ai-${GITHUB_SHA}.tar.gz}"

          ssh \
            -i "$SSH_KEY_FILE" \
            -o UserKnownHostsFile="$KNOWN_HOSTS_FILE" \
            -o StrictHostKeyChecking=yes \
            "${EC2_USER}@${EC2_HOST}" \
            "rm -f '${remote_archive}'; rm -rf '/tmp/aipm-ai-release-${GITHUB_SHA}' '/tmp/aipm-ai-backup-${GITHUB_SHA}'" \
            || true

      - name: Remove SSH files
        if: always()
        shell: bash
        run: |
          rm -f "${{ steps.ssh.outputs.key_file }}" "${{ steps.ssh.outputs.known_hosts_file }}"
